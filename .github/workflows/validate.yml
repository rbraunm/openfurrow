# SPDX-License-Identifier: Apache-2.0
name: validate

on:
  push:
    branches: [claude]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # Real-time scanning stays on; only this job's own folders are excluded, since the suite writes thousands of small
      # files and starts many Python processes. Temp files go to the job's temp folder, not the profile's.
      - name: Exclude the checkout, the job's temp folder and pip's cache from real-time scanning
        if: runner.os == 'Windows'
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, (Join-Path $env:LOCALAPPDATA "pip\Cache")
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Exclude the job's Python from real-time scanning
        if: runner.os == 'Windows'
        run: Add-MpPreference -ExclusionPath (python -c "import sys; print(sys.base_prefix)")
      - name: Install the project with its test and service extras
        run: python -m pip install --constraint constraints.txt --editable ".[test,service]"
      - name: Record the installed versions
        run: python -m pip freeze
      - name: Time the interpreter's start and the command line's, which every command-line test pays
        run: python scripts/startTimes.py
      - name: Check for unused, undefined and redefined names
        run: python -m ruff check --select F openfurrow tests scripts
      - name: Run the test suite
        run: python -m pytest --durations=20
      - name: Smoke-test the installed wheel
        run: python scripts/productSmoke.py

  # The suite on the oldest versions pyproject.toml allows, on the oldest supported Python, so its lower bounds
  # (set as SPEC 0 has them: two years of core dependencies, three of Python) are bounds the suite has passed on.
  oldest:
    name: oldest allowed versions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Exclude the checkout, the job's temp folder and pip's cache from real-time scanning
        if: runner.os == 'Windows'
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, (Join-Path $env:LOCALAPPDATA "pip\Cache")
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Exclude the job's Python from real-time scanning
        if: runner.os == 'Windows'
        run: Add-MpPreference -ExclusionPath (python -c "import sys; print(sys.base_prefix)")
      - name: Pin every direct dependency to its lower bound
        run: python scripts/lowestConstraints.py > lowest.txt
      - name: Install the project on those versions
        run: python -m pip install --constraint lowest.txt --editable ".[test,service,postgresql]"
      - name: Record the installed versions
        run: python -m pip freeze
      - name: Run the test suite
        run: python -m pytest --durations=20

  # The same suite on a PostgreSQL store, the testbed started for this run only.
  postgresql:
    name: test (postgresql, python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Start the testbed's PostgreSQL with a password made for this run
        run: |
          password=$(python -c "import secrets; print(secrets.token_hex(16))")
          echo "::add-mask::$password"
          echo "OPENFURROW_TESTBED_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "OPENFURROW_TEST_POSTGRES=postgresql+pg8000://openfurrow:$password@127.0.0.1:5432/openfurrow" >> "$GITHUB_ENV"
          OPENFURROW_TESTBED_PASSWORD=$password docker compose -f testbed/compose.yaml up --detach --wait postgresql
      - name: Install the project with its test and service extras
        run: python -m pip install --constraint constraints.txt --editable ".[test,service]"
      - name: Run the test suite on PostgreSQL
        run: python -m pytest --store postgresql --durations=20
      - name: Throw the testbed away
        if: always()
        run: docker compose -f testbed/compose.yaml down --volumes

  # Signing in through real identity providers: Carnelian's testbed, at the release OpenFurrow installs,
  # prepared and started for this run only. And a trusted workload: this job's own token from GitHub Actions.
  providers:
    name: providers (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install the project with its test and service extras
        run: python -m pip install --constraint constraints.txt --editable ".[test,service]"
      - name: Check out Carnelian's testbed at the installed release
        run: |
          version=$(python -c "import importlib.metadata; print(importlib.metadata.version('carnelian'))")
          git clone --quiet --branch "v$version" https://github.com/rbraunm/carnelian "$RUNNER_TEMP/carnelian"
          python -m pip install --constraint constraints.txt "$RUNNER_TEMP/carnelian[test]"
      - name: Prepare and start the identity providers
        working-directory: ${{ runner.temp }}/carnelian
        run: |
          secret=$(python -c "import secrets; print(secrets.token_hex(24))")
          echo "::add-mask::$secret"
          CARNELIAN_TESTBED_SECRET=$secret python testbed/prepare.py --host localhost
          docker compose --file testbed/compose.yaml --env-file testbed/generated/keycloak.env --profile directory up --detach --build
          python testbed/prepare.py --host localhost --wait --directory
      - name: Run the sign-in tests against them
        run: python -m pytest tests/testProviders.py "--testbed=$RUNNER_TEMP/carnelian/testbed/generated/testbed.json" --directory
      # The token lasts minutes, so it is asked for right before the tests that present it.
      - name: Ask GitHub for a workload token, which the trusted-workload tests present to the API
        run: |
          token=$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openfurrow-ci" | python -c "import json, sys; print(json.load(sys.stdin)['value'])")
          echo "::add-mask::$token"
          echo "OPENFURROW_GITHUB_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Run the trusted-workload tests with it
        run: python -m pytest tests/testWorkloads.py
      - name: Show the providers' logs
        if: failure()
        working-directory: ${{ runner.temp }}/carnelian
        run: docker compose --file testbed/compose.yaml --env-file testbed/generated/keycloak.env --profile directory logs --no-color --tail 80
      - name: Throw the testbed away
        if: always()
        working-directory: ${{ runner.temp }}/carnelian
        run: docker compose --file testbed/compose.yaml --env-file testbed/generated/keycloak.env --profile directory down --volumes

  # The web server and the scheduler as real services (decision 0009): installed through each system's own service
  # manager under a throwaway name, started, used, stopped and removed. The project is installed as a copy, not
  # from the checkout, so a service's own account can read it: on Linux the checkout is in a home directory.
  service:
    name: service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Exclude the checkout, the job's temp folder and pip's cache from real-time scanning
        if: runner.os == 'Windows'
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, (Join-Path $env:LOCALAPPDATA "pip\Cache")
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Exclude the job's Python from real-time scanning
        if: runner.os == 'Windows'
        run: Add-MpPreference -ExclusionPath (python -c "import sys; print(sys.base_prefix)")
      - name: Install the project with its test and service extras
        run: python -m pip install --constraint constraints.txt ".[test,service]"
      - name: Let a service's account reach the job's Python, which is in the runner's home directory
        if: runner.os == 'macOS'
        run: chmod o+rx "$HOME"
      - name: Install, run and remove the services
        if: runner.os == 'Windows'
        run: python -m pytest tests/testServiceInstall.py --service-install -n0 --durations=10
      - name: Install, run and remove the services, as root
        if: runner.os != 'Windows'
        run: sudo "$(which python)" -m pytest tests/testServiceInstall.py --service-install -n0 -p no:cacheprovider --durations=10
      - name: Show what systemd recorded of the services
        if: failure() && runner.os == 'Linux'
        run: sudo journalctl --no-pager --since "-30min" --unit "openfurrow-*" | tail -n 200

  # The one check main requires: its name stays the same when the matrix changes.
  validated:
    name: validated
    if: always()
    needs: [test, oldest, postgresql, providers, service]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job to have passed
        env:
          testResult: ${{ needs.test.result }}
          postgresqlResult: ${{ needs.postgresql.result }}
          providersResult: ${{ needs.providers.result }}
          serviceResult: ${{ needs.service.result }}
          oldestResult: ${{ needs.oldest.result }}
        run: test "$testResult" = "success" && test "$postgresqlResult" = "success" && test "$providersResult" = "success" && test "$serviceResult" = "success" && test "$oldestResult" = "success"
