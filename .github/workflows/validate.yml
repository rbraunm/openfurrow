# SPDX-License-Identifier: Apache-2.0
name: validate

on:
  push:
    branches: [claude]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the project with its test and service extras
        run: python -m pip install --constraint constraints.txt --editable ".[test,service]"
      - name: Record the installed versions
        run: python -m pip freeze
      - name: Run the test suite
        run: python -m pytest
      - name: Smoke-test the installed wheel
        run: python scripts/productSmoke.py

  # The one check main requires: its name stays the same when the matrix changes.
  validated:
    name: validated
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job to have passed
        env:
          testResult: ${{ needs.test.result }}
        run: test "$testResult" = "success"
