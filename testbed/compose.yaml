# The test fixtures OpenFurrow is checked against (roadmap/governance-plan.md, "Test
# fixtures"). The validation workflow starts them for one run and throws them away; a
# development machine or a lab host keeps them running and reprovisions them from this
# same file. Every password comes from the environment; nothing starts without one.
name: openfurrow-testbed

services:
  postgresql:
    image: postgres:18
    environment:
      POSTGRES_USER: openfurrow
      POSTGRES_PASSWORD: ${OPENFURROW_TESTBED_PASSWORD:?set OPENFURROW_TESTBED_PASSWORD}
      POSTGRES_DB: openfurrow
    ports:
      - "${OPENFURROW_TESTBED_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfurrow -d openfurrow"]
      interval: 2s
      timeout: 5s
      retries: 30
