# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openfurrow"
version = "0.1.0.dev0"
description = "Open, reproducible management for agricultural trials."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2",
  "sqlalchemy>=2",
  "numpy>=1.26",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "statsmodels>=0.14",
]

[project.scripts]
openfurrow = "openfurrow.cli.main:main"

[tool.setuptools.packages.find]
include = ["openfurrow*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test*.py"]
python_classes = ["Test*"]
python_functions = ["test*"]
